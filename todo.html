<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #1f3327;
    --board-edge: #17281d;
    --frame-light: #8a6237;
    --frame-dark: #4a3016;
    --chalk: #ede7d6;
    --chalk-dim: #ede7d688;
    --chalk-yellow: #e9c468;
    --chalk-pink: #dd8f8f;
    --chalk-blue: #93b3cf;
    --line: #ede7d633;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(ellipse at 50% 0%, #24402e 0%, #142219 70%);
    font-family: 'Nunito Sans', sans-serif;
    color: var(--chalk);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    min-height: 100%;
  }

  .frame {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(155deg, var(--frame-light), var(--frame-dark));
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  .board {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--board);
    border-radius: 10px;
    padding: 26px 24px 20px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.45), inset 0 0 0 1px var(--board-edge);
    position: relative;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 2.5rem;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--chalk);
    text-shadow: 0 0 14px rgba(237,231,214,0.15);
  }

  .date {
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--chalk-dim);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--chalk-dim);
    margin: 0 0 18px;
  }

  form {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 18px;
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--chalk);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 1rem;
    padding: 8px 2px;
    outline: none;
    min-width: 0;
  }
  input[type="text"]::placeholder { color: var(--chalk-dim); }
  input[type="text"]:focus { border-bottom-color: var(--chalk-yellow); }

  .add-btn {
    background: none;
    border: 2px solid var(--chalk-yellow);
    color: var(--chalk-yellow);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .add-btn:hover { background: rgba(233,196,104,0.12); transform: rotate(90deg); }
  .add-btn:focus-visible, input:focus-visible, button:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--chalk-blue);
    outline-offset: 2px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab {
    background: rgba(237,231,214,0.06);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
  }
  .tab.active {
    color: var(--board);
    background: var(--chalk-yellow);
    border-color: var(--chalk-yellow);
  }

  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    min-height: 60px;
  }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  li.item:last-child { border-bottom: none; }

  .checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 2px solid var(--chalk-blue);
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    background: transparent;
  }
  .checkbox:checked {
    border-color: var(--chalk-yellow);
    background: rgba(233,196,104,0.15);
  }
  .checkbox:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 6px;
    width: 11px;
    height: 6px;
    border-left: 2.5px solid var(--chalk-yellow);
    border-bottom: 2.5px solid var(--chalk-yellow);
    transform: rotate(-45deg);
  }

  .item-text {
    flex: 1;
    font-size: 1.02rem;
    line-height: 1.4;
    word-break: break-word;
    padding-top: 1px;
  }
  li.done .item-text {
    color: var(--chalk-dim);
    text-decoration: line-through wavy var(--chalk-dim);
    text-decoration-thickness: 1px;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 4px;
    opacity: 0.5;
    flex-shrink: 0;
  }
  .del-btn:hover { opacity: 1; color: var(--chalk-pink); }

  .empty {
    text-align: center;
    color: var(--chalk-dim);
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    padding: 26px 10px 10px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 2px dashed var(--line);
    font-size: 0.78rem;
    color: var(--chalk-dim);
  }

  .clear-btn {
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .clear-btn:hover { color: var(--chalk-pink); }

  @media (prefers-reduced-motion: reduce) {
    .add-btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="board">
      <header>
        <h1>Today's List</h1>
        <span class="date" id="dateLabel"></span>
      </header>
      <p class="subtitle">Chalk it up, wipe it clean.</p>

      <form id="addForm">
        <input type="text" id="taskInput" placeholder="Write something down…" maxlength="140" autocomplete="off">
        <button type="submit" class="add-btn" aria-label="Add task">+</button>
      </form>

      <div class="tabs" role="tablist" aria-label="Filter tasks">
        <button class="tab active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="tab" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="tab" data-filter="done" role="tab" aria-selected="false">Done</button>
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="emptyMsg" style="display:none;"></p>

      <footer>
        <span id="countLabel">0 left</span>
        <button class="clear-btn" id="clearDone">erase completed</button>
      </footer>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'chalk-todo-tasks';
  const form = document.getElementById('addForm');
  const input = document.getElementById('taskInput');
  const listEl = document.getElementById('list');
  const emptyMsg = document.getElementById('emptyMsg');
  const countLabel = document.getElementById('countLabel');
  const clearDoneBtn = document.getElementById('clearDone');
  const tabs = document.querySelectorAll('.tab');
  const dateLabel = document.getElementById('dateLabel');

  let filter = 'all';
  let tasks = [];

  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    } catch (e) {
      tasks = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      // storage unavailable; app still works for this session
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function render() {
    const filtered = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done') return t.done;
      return true;
    });

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = tasks.length === 0
        ? 'Nothing here yet — add your first task.'
        : 'No tasks in this view.';
    } else {
      emptyMsg.style.display = 'none';
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checkbox';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', 'Mark "' + task.text + '" as ' + (task.done ? 'active' : 'done'));
        checkbox.addEventListener('change', () => toggleTask(task.id));

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.innerHTML = '&times;';
        delBtn.setAttribute('aria-label', 'Delete "' + task.text + '"');
        delBtn.addEventListener('click', () => deleteTask(task.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.done).length;
    countLabel.textContent = remaining + (remaining === 1 ? ' left' : ' left');
  }

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    tasks.unshift({ id: uid(), text: trimmed, done: false });
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    addTask(input.value);
    input.value = '';
    input.focus();
  });

  clearDoneBtn.addEventListener('click', function () {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  tabs.forEach(tab => {
    tab.addEventListener('click', function () {
      tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      filter = tab.dataset.filter;
      render();
    });
  });

  load();
  render();
})();
</script>
</body>
</html>
